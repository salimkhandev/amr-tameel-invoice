name: Infrastructure Keep Alive
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase Project
        if: secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          curl --fail \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/users?limit=1"

      - name: Ping Health Check Endpoint
        if: secrets.VERCEL_URL != ''
        run: |
          curl --fail ${{ secrets.VERCEL_URL }}/api/health

      - name: Keep Repo Alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last keep-alive: $(date)" > .github/keep-alive.txt
          git add .github/keep-alive.txt
          git commit -m "chore: keep alive $(date +%Y-%m-%d) [skip ci]"
          git push
