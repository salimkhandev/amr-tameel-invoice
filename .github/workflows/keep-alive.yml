name: Infrastructure Keep Alive
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl --fail \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/users?limit=1"
          else
            echo "Supabase secrets not set, skipping ping"
          fi

      - name: Ping Health Check Endpoint
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
        run: |
          if [ -n "$VERCEL_URL" ]; then
            curl --fail $VERCEL_URL/api/health
          else
            echo "Vercel URL not set, skipping ping"
          fi

      - name: Keep Repo Alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last keep-alive: $(date)" > .github/keep-alive.txt
          git add .github/keep-alive.txt
          git commit -m "chore: keep alive $(date +%Y-%m-%d) [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
